services:
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-risk-monitor
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: credit-risk-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - monitor
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: credit-risk-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/grafana_dashboard.json
    volumes:
      - ./configs/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/monitoring/grafana_dashboard.json:/var/lib/grafana/dashboards/grafana_dashboard.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped
