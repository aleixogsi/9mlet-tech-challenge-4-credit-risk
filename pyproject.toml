[project]
name = "credit-risk-monitoring"
version = "0.1.0"
description = "Tech Challenge Fase 4 (MLET/FIAP): contratos de dados, drift, observabilidade e governança de um modelo de Credit Scoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pandera>=0.20",
    "evidently>=0.7",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "kagglehub>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
